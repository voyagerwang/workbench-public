<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 首帧前确定主题，避免闪白/闪黑（auto：7:00–19:00 日间）
      // 注意：必须位于所有 <link rel="stylesheet"> 之前——
      // 待加载的样式表会阻塞后续内联脚本执行，导致主题设置被延迟
      (function () {
        var mode = 'auto';
        try { mode = localStorage.getItem('yao.theme') || 'auto'; } catch (e) {}
        var h = new Date().getHours();
        var dark = mode === 'dark' || (mode === 'auto' && (h < 7 || h >= 19));
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.style.backgroundColor = dark ? '#05060a' : '#f4f5f7';
      })();
    </script>
    <title>YZ工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060a'/%3E%3Ctext x='32' y='42' font-size='24' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='%238b80f9'%3EYZ%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
